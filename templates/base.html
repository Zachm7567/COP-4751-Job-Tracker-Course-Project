<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{{ url_for('dashboard') }}">Job Tracker</a>
            <nav>
                {% set current = request.endpoint or '' %}
                <a href="{{ url_for('dashboard') }}" class="{{ 'active' if current == 'dashboard' }}">Dashboard</a>
                <a href="{{ url_for('companies') }}" class="{{ 'active' if current.startswith('compan') }}">Companies</a>
                <a href="{{ url_for('jobs') }}" class="{{ 'active' if (current.startswith('job_') and current != 'job_match') or current == 'jobs' }}">Jobs</a>
                <a href="{{ url_for('applications') }}" class="{{ 'active' if current.startswith('application') }}">Applications</a>
                <a href="{{ url_for('contacts') }}" class="{{ 'active' if current.startswith('contact') }}">Contacts</a>
                <a href="{{ url_for('job_match') }}" class="{{ 'active' if current == 'job_match' }}">Job Match</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
